# CI for the Canadian Housing Agent. Runs on GitHub-hosted runners: free on
# public repositories, and no secrets are required (LLM calls are mocked).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Docs index is fresh
        run: npm run embed:docs && git diff --exit-code -- data/docs_index.json
      - name: Test
        run: npx vitest run
        env:
          MOCK_LLM: "1"
      - name: Build
        run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test pipeline
        run: python3 -m unittest discover -s pipeline/tests -v
